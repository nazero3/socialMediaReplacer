# Run once (or when schema changes) if local `prisma db push` fails (e.g. IPv6-only DNS at home).
# Repo → Actions → "Prisma db push" → Run workflow.
name: Prisma db push

on:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate DATABASE_URL for CI (Supabase pooler)
        run: bash scripts/check-github-actions-database-url.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma db push
        run: pnpm --filter @smr/api exec prisma db push
