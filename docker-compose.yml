services:
  postgres:
    image: postgres:16-alpine
    container_name: smr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smr
      POSTGRES_PASSWORD: smr
      POSTGRES_DB: smr
    ports:
      - "5433:5432"
    volumes:
      - smr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smr -d smr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smr-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - smr_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smr_postgres:
  smr_redis:
